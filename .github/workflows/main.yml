name: Gatsby CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm" # cache npm deps

      # Cache Gatsby build cache + public folder
      - name: Cache Gatsby files
        uses: actions/cache@v3
        with:
          path: |
            .cache
            public
          key: gatsby-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'gatsby-config.js', 'gatsby-node.js', 'package.json') }}
          restore-keys: |
            gatsby-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Gatsby site
        run: npm run build -- --prefix-paths

      # Upload build output so deploy job can reuse it (only on main)
      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v3
        with:
          name: gatsby-public
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: gatsby-public
          path: public

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: deploy
